name: Deploy Marva website
on:
  push:
    branches: [main]
    paths:
      - 'website/live/**'
      - 'ops/check-live.mjs'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
concurrency:
  group: deploy-marva-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the checked-in production source
        run: node ops/check-live.mjs
      - name: Deploy exact checked-in static files
        run: npx --yes wrangler@4.108.0 pages deploy website/live --project-name=marva-website --branch=main --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8648b92ed2c23dd6065cdb4d74df01fd
