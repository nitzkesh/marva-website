name: Validate Marva production source
on:
  pull_request:
    paths:
      - 'website/live/**'
      - 'ops/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node ops/check-live.mjs
      - name: Verify initial production recovery
        if: github.head_ref == 'sync/live-2026-11-25'
        run: node ops/check-live.mjs --baseline
