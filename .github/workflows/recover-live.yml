name: Recover approved live Marva site
on:
  push:
    branches: [sync/live-2026-11-25]
    paths:
      - '.github/workflows/recover-live.yml'
      - 'ops/recover-live.mjs'
      - 'ops/live-baseline.json'
permissions:
  contents: write
concurrency:
  group: recover-marva-live
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/live-2026-11-25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install content hash verifier
        run: npm install --prefix "$RUNNER_TEMP/marva-hash" --ignore-scripts --no-audit --no-fund blake3-wasm@2.1.5
      - name: Recover and verify immutable production files
        run: node ops/recover-live.mjs
        env:
          HASH_DEPENDENCIES: ${{ runner.temp }}/marva-hash
      - name: Save verified source on reconciliation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f website/live ops/live-recovery-report.json
          git commit -m "Recover verified live site and remove weddings from Hebrew events copy"
          git push origin HEAD:sync/live-2026-11-25
